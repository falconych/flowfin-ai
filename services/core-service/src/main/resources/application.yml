server:
  port: 8080

spring:
  application:
    name: core-service

  # Database Connection (PostgreSQL)
  datasource:
    url: jdbc:postgresql://localhost:5432/flowfin_db
    username: flowfin_user
    password: flowfin_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Event Streaming (Apache Kafka)
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: core-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.flowfin.core.event"
        spring.json.add.type.headers: true

  # Vector Database (Qdrant & Spring AI)
  ai:
    vectorstore:
      qdrant:
        host: localhost
        port: 6334 # gRPC port for Spring AI
        collection-name: flowfin_documents
 

app:
  processing:
    timeout-seconds: 10
  chunking:
    max-chunk-size: 500
    overlap-size: 50
  qdrant:
    host: ${QDRANT_HOST:localhost}
    port: ${QDRANT_PORT:6334}
    collection-name: document_chunks
    vector-size: 384 # Standard size for miniature embedding models (e.g. all-MiniLM-L6-v2)
  kafka:
    topics:
      raw-documents: raw-documents-topic